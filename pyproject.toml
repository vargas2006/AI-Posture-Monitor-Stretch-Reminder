[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-monitor"
version = "0.1.0"
description = "AI Posture Monitor and Stretch Reminder"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python",
    "cvzone",
    "mediapipe",
    "requests",
    "python-dotenv",
    "flet"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]
